version: '3.8'

services:
  mailserver:
    # Imagen oficial desde GitHub Container Registry
    # Docker Hub (analogic/poste.io) está deprecado
    image: ghcr.io/analogic/poste.io
    container_name: posteio
    hostname: ${MAIL_HOSTNAME}
    restart: unless-stopped

    env_file:
      - .env
    environment:
      - TZ=${TZ}
      - HTTPS=OFF

    # Puertos de correo (expuestos al host)
    ports:
      - "25:25"      # SMTP  - recepción de correo entrante
      - "465:465"    # SMTPS - envío saliente con SSL implícito
      - "587:587"    # Submission - envío saliente con STARTTLS
      - "993:993"    # IMAPS - acceso a buzones con SSL
      - "4190:4190"  # Sieve  - filtros de correo (opcional)

      # Interfaz web HTTP (temporal, puerto alternativo)
      # Solo HTTP. Sin HTTPS interno. Nginx será el terminador SSL.
      - "${WEBMAIL_HTTP_PORT}:80"

    # Volúmenes persistentes
    volumes:
      - ./data:/data        # Correos, cuentas, configuración, todo

    # Red compartida para comunicación con el proyecto principal
    networks:
      - shared-network

    # Healthcheck: verifica que la interfaz web de Poste.io responda
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  shared-network:
    # Red externa compartida con comparadorBackendFast
    # Crear antes con: docker network create shared-network
    external: true
